# Does the site a reader receives say what this repository says?
#
# `make check` proves the committed site/ is byte-for-byte what the code produces
# from the vendored sources, and publish-site runs it before every upload. That
# grades the checkout. Nothing here has ever graded the bytes a reader receives, so
# a pages run that failed, never fired, or published an older commit would leave
# every gate green while https://chelseakr.github.io/chalkline/ served a different
# credential graph or a different coverage count, and nothing in this repository
# could tell.
#
# This is the check for the deployment: rebuild, fetch, and fail naming every
# byte-level difference.
#
# It reads the network, deliberately, which is the one thing the merge gate must
# never do. That is why it lives in its own workflow, holds only `contents: read`,
# and is not a required check: it grades the deployment, and a deployment that has
# not happened yet is not a reason to block a merge.
#
# Runs daily and on demand (Actions > live integrity sentinel > Run workflow).
name: live integrity sentinel

on:
  schedule:
    - cron: "31 12 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Deduplicate reads without ever cancelling or queueing behind a deploy.
  group: live-integrity
  cancel-in-progress: false

jobs:
  verify-live:
    name: the live surface is what this repository publishes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          version: ">=0.11.0"
          python-version: "3.12"

      - name: Install the locked environment
        run: uv sync --locked

      - name: Compare the live surface with what this checkout publishes
        run: |
          set -uo pipefail
          expected_sha="$(git rev-parse HEAD)"

          # This step declares no `shell:`, so it runs under GitHub's default for a
          # `run` block on Linux -- `bash -e {0}` -- and `set -uo pipefail` cannot turn
          # errexit off. A bare `python3 scripts/verify_live_site.py` line therefore
          # ENDED THE STEP the moment the sentinel reported a difference, before
          # `verify_rc` was ever assigned. Everything below it, including the
          # deploy-race excuse this step exists to apply, was unreachable in exactly
          # the case it was written for. Measured by running the step body under
          # `bash` and under `bash -e` with both commands stubbed; the two shells
          # disagree on every row, and only one of them is what ships.
          #
          # A command in an `if` condition is exempt from errexit by language rule, so
          # this is what makes the exit code readable at all.
          if python3 scripts/verify_live_site.py; then
            verify_rc=0
          else
            verify_rc="$?"
          fi

          # No difference to excuse: the remote read is not a decision input here, so
          # do not take it. Under the old body a blip on that read failed a run whose
          # verdict was already green (measured: exit 128).
          if [ "$verify_rc" -eq 0 ]; then
            exit 0
          fi

          # The sentinel says the live surface differs. One thing excuses that: a
          # deploy for a newer commit landed while this ran. Establish it, or report
          # the verdict. "main moved" and "I could not ask" must not arrive as the
          # same answer -- under plain `bash` they did, and the only trace was a
          # warning with nothing between "moved to" and "while this ran".
          if ! remote_sha="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"; then
            echo "::error::the live surface differs from ${expected_sha}, and origin/main could not be read to establish whether a newer deploy landed while this ran; reporting the sentinel's verdict (${verify_rc})"
            exit "$verify_rc"
          fi
          if [ -z "${remote_sha}" ]; then
            echo "::error::git ls-remote named no sha for refs/heads/main; reporting the sentinel's verdict (${verify_rc})"
            exit "$verify_rc"
          fi
          if [ "$remote_sha" != "$expected_sha" ]; then
            echo "::warning::main moved from ${expected_sha} to ${remote_sha} while this ran; re-run once its deploy finishes"
            exit 0
          fi
          exit "$verify_rc"
