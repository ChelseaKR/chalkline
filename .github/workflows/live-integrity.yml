# Does the site a reader receives say what this repository says?
#
# `make check` proves the committed site/ is byte-for-byte what the code produces
# from the vendored sources, and publish-site runs it before every upload. That
# grades the checkout. Nothing here has ever graded the bytes a reader receives, so
# a pages run that failed, never fired, or published an older commit would leave
# every gate green while https://chelseakr.github.io/chalkline/ served a different
# credential graph or a different coverage count, and nothing in this repository
# could tell.
#
# This is the check for the deployment: rebuild, fetch, and fail naming every
# byte-level difference.
#
# It reads the network, deliberately, which is the one thing the merge gate must
# never do. That is why it lives in its own workflow, holds only `contents: read`,
# and is not a required check: it grades the deployment, and a deployment that has
# not happened yet is not a reason to block a merge.
#
# Runs daily and on demand (Actions > live integrity sentinel > Run workflow).
name: live integrity sentinel

on:
  schedule:
    - cron: "31 12 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Deduplicate reads without ever cancelling or queueing behind a deploy.
  group: live-integrity
  cancel-in-progress: false

jobs:
  verify-live:
    name: the live surface is what this repository publishes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          version: ">=0.11.0"
          python-version: "3.12"

      - name: Install the locked environment
        run: uv sync --locked

      - name: Compare the live surface with what this checkout publishes
        run: |
          set -uo pipefail
          expected_sha="$(git rev-parse HEAD)"
          python3 scripts/verify_live_site.py
          verify_rc="$?"
          # A deploy for a newer commit may have landed while this ran, in which case
          # the live surface differing from THIS commit is the deploy working. Only
          # that exact case is excused, and only by re-reading the remote afterwards.
          remote_sha="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
          if [ "$remote_sha" != "$expected_sha" ]; then
            echo "::warning::main moved to ${remote_sha} while this ran; re-run once its deploy finishes"
            exit 0
          fi
          exit "$verify_rc"
