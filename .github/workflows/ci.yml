# Least-privilege GITHUB_TOKEN, SHA-pinned actions, and the merge-blocking gates from
# SECURITY-AND-SUPPLY-CHAIN-STANDARD §§4-5 (SAST, secret scan, SCA) plus
# CODE-QUALITY-STANDARD §2 (`make verify`).
#
# Every action is pinned to the full 40-char commit SHA of its tag, resolved 2026-08-07 via
# `gh api repos/OWNER/REPO/commits/TAG`. Actions stay `@<sha> # vX.Y.Z` so the version is
# human-readable next to the pin, per SECURITY-AND-SUPPLY-CHAIN-STANDARD §6.
#
# No job in this workflow reaches the network for project data. The build reads only the
# vendored snapshots under data/source/, which is what makes it reproducible here.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ">=0.11.0"
          python-version: "3.12"

      - name: make verify (byte-for-byte the local target)
        run: make verify

      - uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        if: always()
        with:
          files: coverage.xml
          fail_ci_if_error: false

  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ">=0.11.0"
          python-version: "3.12"
      - run: make audit

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # gitleaks-action lists the pull request's commits to scope its scan; without this it
      # gets a 403 from the pulls API and the job dies before scanning anything.
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ">=0.11.0"
          python-version: "3.12"
      - run: uvx --from semgrep==1.168.0 semgrep scan --error --metrics off --config p/python --config p/security-audit src tests scripts
