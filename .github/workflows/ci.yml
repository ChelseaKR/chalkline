# Least-privilege GITHUB_TOKEN, SHA-pinned actions, and four reporting jobs: SAST, secret
# scan and SCA from SECURITY-AND-SUPPLY-CHAIN-STANDARD §§4-5, plus `make verify` from
# CODE-QUALITY-STANDARD §2.
#
# These jobs report. They do not block. `main` carries no protection: as of 2026-08-15
# `gh api repos/ChelseaKR/chalkline/rulesets` returns `[]`, `branches/main` returns
# `"protected": false`, and `branches/main/protection` returns 404. Nothing here prevents a
# direct push to `main`, a force-push, a branch deletion, or a merge over a red run. An
# earlier version of this header called these gates merge-blocking, which was the one claim
# in the file a reader was most likely to check and the one thing it got wrong.
#
# Making them binding is a repository setting, not a change to this file. It needs a
# ruleset on `main` requiring `verify`, `audit`, `secret-scan` and `sast` by those exact job
# names, plus `non_fast_forward` and `deletion`. Until that ruleset exists, treat a green
# run here as evidence and not as an obstacle. Tracked in issue #22.
#
# Every action is pinned to the full 40-char commit SHA of its tag, resolved 2026-08-07 via
# `gh api repos/OWNER/REPO/commits/TAG`. Actions stay `@<sha> # vX.Y.Z` so the version is
# human-readable next to the pin, per SECURITY-AND-SUPPLY-CHAIN-STANDARD §6.
#
# No job in this workflow reaches the network for project data. The build reads only the
# vendored snapshots under data/source/, which is what makes it reproducible here.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ">=0.11.0"
          python-version: "3.12"

      - name: make verify (byte-for-byte the local target)
        run: make verify

      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        if: always()
        with:
          files: coverage.xml
          fail_ci_if_error: false

  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ">=0.11.0"
          python-version: "3.12"
      - run: make audit

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # gitleaks-action lists the pull request's commits to scope its scan; without this it
      # gets a 403 from the pulls API and the job dies before scanning anything.
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ">=0.11.0"
          python-version: "3.12"
      - run: uvx --from semgrep==1.168.0 semgrep scan --error --metrics off --config p/python --config p/security-audit src tests scripts
