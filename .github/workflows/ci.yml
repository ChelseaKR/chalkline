# Least-privilege GITHUB_TOKEN, SHA-pinned actions, and five reporting jobs: SAST (Semgrep
# over src/tests/scripts, zizmor over the workflow files themselves) and secret scan and SCA
# from SECURITY-AND-SUPPLY-CHAIN-STANDARD §§4-5, plus `make verify` from
# CODE-QUALITY-STANDARD §2. `codeql.yml` adds a sixth job, `analyze`, a second and
# independently built opinion on the workflow files alongside zizmor.
#
# These jobs block. As of 2026-08-21 a `protect-main` ruleset on `main` requires `verify`,
# `audit`, `secret-scan`, `sast`, `zizmor` and `analyze` (from `codeql.yml`) by those exact
# job names, plus `non_fast_forward` and `deletion`.
#
# An earlier version of this header added "with `current_user_can_bypass: never` -- not even
# an administrator can override it". That was true when the ruleset was posted on 2026-08-21
# and is not true now, so it has been removed. Re-read on 2026-08-28 (`gh api
# repos/ChelseaKR/chalkline/rulesets/21156701`) the ruleset carries a `RepositoryRole` bypass
# actor with `bypass_mode: always`, reports `current_user_can_bypass: always` for the owner,
# and has an `updated_at` of 2026-08-26. That bypass is deliberate and the owner has confirmed
# it: an agent once removed an admin bypass elsewhere and locked the owner out of the
# repository, so a role-level way back in is kept on purpose. These checks therefore still
# block a merge for anyone who cannot bypass, and deliberately do not block one for the owner.
# `.github/rulesets/main.json` declared `"bypass_actors": []` until 2026-08-29, which made the
# committed file stale rather than the live setting wrong, and made the documented re-apply
# command a way to strip the bypass and lock the owner out. The file now carries the same one
# actor the live ruleset does, `{"actor_id": 5, "actor_type": "RepositoryRole",
# "bypass_mode": "always"}`, and `tests/test_ruleset.py` fails if it stops carrying it.
#
# The refusal itself was not taken on the API response's word: a throwaway PR (#29) with a
# deliberately failing test was opened against a red `verify`, and both `gh pr merge` and
# `mergeStateStatus` confirmed the merge was refused ("the base branch policy prohibits the
# merge") before the PR was closed unmerged. Two earlier versions of this header called these
# gates merge-blocking while `main` carried no protection at all, which was the one claim in
# the file a reader was most likely to check and the one thing it got wrong twice. Issue #22.
#
# Every action is pinned to the full 40-char commit SHA of its tag, resolved 2026-08-07 via
# `gh api repos/OWNER/REPO/commits/TAG`. Actions stay `@<sha> # vX.Y.Z` so the version is
# human-readable next to the pin, per SECURITY-AND-SUPPLY-CHAIN-STANDARD §6.
#
# No job in this workflow reaches the network for project data. The build reads only the
# vendored snapshots under data/source/, which is what makes it reproducible here.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ">=0.11.0"
          python-version: "3.12"

      - name: make verify (byte-for-byte the local target)
        run: make verify

      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        if: always()
        with:
          files: coverage.xml
          fail_ci_if_error: false

  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ">=0.11.0"
          python-version: "3.12"
      - run: make audit

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # gitleaks-action lists the pull request's commits to scope its scan; without this it
      # gets a 403 from the pulls API and the job dies before scanning anything.
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ">=0.11.0"
          python-version: "3.12"
      - run: uvx --from semgrep==1.168.0 semgrep scan --error --metrics off --config p/python --config p/security-audit src tests scripts

  # Workflow SAST (CICD-13): lints .github/workflows/** for injection, missing permissions,
  # unpinned actions, credential persistence, and the other ways a workflow file itself can
  # be the vulnerability. `sast` above scans src/tests/scripts; nothing scanned the workflows
  # that run them until this job. Zero findings expected -- verified locally before this job
  # was added, the same discipline `verify` holds the rest of the tree to.
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # zizmor-action uploads its SARIF report to Code Scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@192e21d79ab29983730a13d1382995c2307fbcaa # v0.5.7
