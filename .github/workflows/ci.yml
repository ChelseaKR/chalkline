# Least-privilege GITHUB_TOKEN, SHA-pinned actions, and five reporting jobs: SAST (Semgrep
# over src/tests/scripts, zizmor over the workflow files themselves) and secret scan and SCA
# from SECURITY-AND-SUPPLY-CHAIN-STANDARD §§4-5, plus `make verify` from
# CODE-QUALITY-STANDARD §2. `codeql.yml` adds a sixth job, `analyze`, a second and
# independently built opinion on the workflow files alongside zizmor.
#
# These jobs block. As of 2026-08-21 a `protect-main` ruleset on `main` requires `verify`,
# `audit`, `secret-scan`, `sast`, `zizmor` and `analyze` (from `codeql.yml`) by those exact
# job names, plus `non_fast_forward` and `deletion`.
#
# An earlier version of this header added "with `current_user_can_bypass: never` -- not even
# an administrator can override it". That was true when the ruleset was posted on 2026-08-21
# and is not true now, so it has been removed. Re-read on 2026-08-28 (`gh api
# repos/ChelseaKR/chalkline/rulesets/21156701`) the ruleset carries a `RepositoryRole` bypass
# actor with `bypass_mode: always`, reports `current_user_can_bypass: always` for the owner,
# and has an `updated_at` of 2026-08-26. That bypass is deliberate and the owner has confirmed
# it: an agent once removed an admin bypass elsewhere and locked the owner out of the
# repository, so a role-level way back in is kept on purpose. These checks therefore still
# block a merge for anyone who cannot bypass, and deliberately do not block one for the owner.
# `.github/rulesets/main.json` declared `"bypass_actors": []` until 2026-08-29, which made the
# committed file stale rather than the live setting wrong, and made the documented re-apply
# command a way to strip the bypass and lock the owner out. The file now carries the same one
# actor the live ruleset does, `{"actor_id": 5, "actor_type": "RepositoryRole",
# "bypass_mode": "always"}`, and `tests/test_ruleset.py` fails if it stops carrying it.
#
# The refusal itself was not taken on the API response's word: a throwaway PR (#29) with a
# deliberately failing test was opened against a red `verify`, and both `gh pr merge` and
# `mergeStateStatus` confirmed the merge was refused ("the base branch policy prohibits the
# merge") before the PR was closed unmerged. Two earlier versions of this header called these
# gates merge-blocking while `main` carried no protection at all, which was the one claim in
# the file a reader was most likely to check and the one thing it got wrong twice. Issue #22.
#
# Every action is pinned to the full 40-char commit SHA of its tag, resolved 2026-08-07 via
# `gh api repos/OWNER/REPO/commits/TAG`. Actions stay `@<sha> # vX.Y.Z` so the version is
# human-readable next to the pin, per SECURITY-AND-SUPPLY-CHAIN-STANDARD §6.
#
# No job in this workflow reaches the network for project data. The build reads only the
# vendored snapshots under data/source/, which is what makes it reproducible here.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # A push to a branch is not a superseded pull-request commit. Keying the group
  # on the ref alone gave every commit on `main` ONE shared slot: GitHub allows
  # one running plus one pending run per group, so a second push cancels the run
  # the first commit was still executing (`cancel-in-progress: true`), and a
  # third push evicts the second from the pending slot (`false`). Either way the
  # commit lands with no verdict at all, and it is reported as `cancelled` or is
  # simply absent -- never as red -- so nothing surfaces it.
  #
  # The discriminator below gives each pushed commit its own slot while leaving
  # pull-request runs grouped per PR, so a superseded PR commit is still
  # canceled. `cancel-in-progress` is deliberately unchanged.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # tests/test_release_claims.py compares the version pyproject.toml declares
          # against `git tag --list`. The default depth fetches no tags, which would make
          # an untagged repository and an unfetched one look identical and turn that gate
          # into one that always passes. It refuses to run in a shallow checkout for the
          # same reason, so this is not optional: without it the verify job fails.
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          version: ">=0.11.0"
          python-version: "3.12"

      - name: make verify (byte-for-byte the local target)
        run: make verify

      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: always()
        with:
          files: coverage.xml
          fail_ci_if_error: false

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          version: ">=0.11.0"
          python-version: "3.12"
      - run: make audit

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Puts the whole history on disk. Necessary, and on its own not
          # sufficient: what the scanner reads is decided by how it is invoked,
          # two lines below, not by how much of the repository was fetched.
          fetch-depth: 0
          persist-credentials: false
      - name: Secret scan (gitleaks, full history)
        # This job used to be `gitleaks/gitleaks-action`, which picks its scan
        # range from the event: on a push it runs
        # `gitleaks detect --log-opts=--no-merges --first-parent BASE^..HEAD`,
        # and when the push carries a single commit -- every squash merge into
        # `main` -- it runs `--log-opts=-1`, i.e. exactly one commit. `main` has
        # 94. A credential added in one commit and deleted in the next was
        # therefore invisible to a required check named `secret-scan`, and the
        # `fetch-depth: 0` above did not change that: it governs what is
        # fetched, not what is read.
        #
        # A pinned, checksum-verified binary invoked as `gitleaks git .` with no
        # `--log-opts` walks every commit reachable from HEAD on every event, so
        # the range no longer depends on how the run was triggered.
        run: |
          set -euo pipefail
          GL=8.30.1
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${GL}"
          ARCHIVE="gitleaks_${GL}_linux_x64.tar.gz"
          # --retry retries the DOWNLOAD, never the verdict. A transient
          # `curl: (35) Recv failure` from github.com turned this required check
          # red having read zero commits, which is indistinguishable in the
          # check list from a real finding. `curl -f` plus `set -e` still stop
          # the job after the last attempt, and the scan itself runs once.
          curl -sSfL --retry 3 --retry-all-errors --retry-delay 2 \
            -o "/tmp/${ARCHIVE}" "${BASE}/${ARCHIVE}"
          curl -sSfL --retry 3 --retry-all-errors --retry-delay 2 \
            -o /tmp/gitleaks_checksums.txt "${BASE}/gitleaks_${GL}_checksums.txt"
          (cd /tmp && grep "  ${ARCHIVE}$" gitleaks_checksums.txt | sha256sum --check --strict)
          tar -xzf "/tmp/${ARCHIVE}" -C /tmp gitleaks
          /tmp/gitleaks git . --no-banner --redact --exit-code 1

  sast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          version: ">=0.11.0"
          python-version: "3.12"
      - run: uvx --from semgrep==1.168.0 semgrep scan --error --metrics off --config p/python --config p/security-audit src tests scripts

  # Workflow SAST (CICD-13): lints .github/workflows/** for injection, missing permissions,
  # unpinned actions, credential persistence, and the other ways a workflow file itself can
  # be the vulnerability. `sast` above scans src/tests/scripts; nothing scanned the workflows
  # that run them until this job. Zero findings expected -- verified locally before this job
  # was added, the same discipline `verify` holds the rest of the tree to.
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # zizmor-action uploads its SARIF report to Code Scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
