# SAST for the workflow files, CodeQL's "actions" language (CICD-13). `sast` in ci.yml
# already covers src/tests/scripts with Semgrep, and `zizmor` there covers the workflow files
# with a purpose-built linter; this is a second, independently built implementation of the
# same workflow-SAST idea, the same "neither subsumes the other" reasoning this project
# applies to its own CTDL validators. Only the `actions` language is analyzed here -- not
# `python` -- because Semgrep already holds that ground and running CodeQL over it too would
# be a second, more expensive opinion this repository has not asked for.
#
# On a schedule as well as on every PR, so drift in CodeQL's own query packs
# gets caught even on a quiet repository between changes.
#
# Every action is pinned to the full 40-char commit SHA of its tag, per
# SECURITY-AND-SUPPLY-CHAIN-STANDARD §6.
name: codeql

on:
  pull_request:
  # No push: trigger. CI-CD-STANDARD.md 11e — the pull_request run below
  # already analysed this exact commit, so re-running CodeQL on the merge
  # to main pays for the same analysis twice. The weekly schedule keeps the
  # default-branch alert baseline fresh when no PR has landed.
  schedule:
    - cron: "0 8 * * 3" # Wednesday 08:00 UTC

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # required to upload CodeQL results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: actions
      - uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          category: "/language:actions"
