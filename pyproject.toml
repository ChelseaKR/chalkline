[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# The distribution name is not "chalkline": that name is taken on PyPI by an unrelated
# project (an agent-context tracker by Andrew Park, https://github.com/aardpark/trace),
# so publishing under it is impossible and documenting an install under it would send a
# reader to a stranger's code. The suffix names what this models -- CTDL -- and follows
# the portfolio's existing pattern for the same collision (gauntlet-evals, cairn-assistant,
# nearmiss-safety, plumbline-eval). The *import* package and the console script stay
# `chalkline`: a distribution name and an import name are allowed to differ, and the
# project's own name has not changed.
name = "chalkline-ctdl"
version = "0.1.0"
description = "California educator credential authorizations, modeled onto CTDL"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
  { name = "Chelsea Kelly-Reif" },
]
readme = "README.md"
dependencies = []

[project.scripts]
chalkline = "chalkline.cli:main"

[dependency-groups]
dev = [
  "ruff>=0.16.4",
  "mypy>=2.3.1",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "pytest-xdist>=3.8.0",
  "pip-audit>=2.10.1",
  # An independently written implementation of the same specification, used as a second
  # opinion on the published graph. Pinned rather than floated: a new rule appearing in a
  # patch release is a fact about CTDL worth reviewing in a diff, not absorbing silently.
  "ctdl-validate==0.2.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/chalkline"]

[tool.hatch.build.targets.wheel.force-include]
"src/chalkline/ctdl/ctdl-context.json" = "chalkline/ctdl/ctdl-context.json"
"src/chalkline/ctdl/ctdl-schema.json" = "chalkline/ctdl/ctdl-schema.json"

# --- CODE-QUALITY-STANDARD §2 single-source ruff/mypy/pytest config ---
# Portfolio default: repos change values, not keys. Do not fork this block;
# edit STANDARDS/CODE-QUALITY-STANDARD.md upstream if the floor itself moves.

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "S", "C90", "RUF"]
ignore = ["E501"]            # line length owned by the formatter
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]        # assert is expected in tests
[tool.ruff.lint.mccabe]
max-complexity = 10
[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
warn_return_any = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
pythonpath = ["src"]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
markers = [
  "slow: > 2s",
  "integration: requires an external service",
  "smoke: critical path",
]

[tool.coverage.run]
branch = true
source = ["src"]
[tool.coverage.report]
# CODE-QUALITY-STANDARD §2 sets the libraries and data projects minimum at >=90%.
# That is the standard's minimum, not this repo's floor. The suite measures 100.00%
# branch coverage over 320 tests (2026-08-29), so a floor of 90 left ten points in
# which untested code could enter the tree and still leave the build green. The gate
# now sits three points under what is measured: enough slack that an unrelated change
# does not fail the build, not enough to hide a real loss of covered code.
fail_under = 97
show_missing = true
