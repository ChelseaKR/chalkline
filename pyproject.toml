[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chalkline"
version = "0.1.0"
description = "California educator credential authorizations, modeled onto CTDL"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
  { name = "Chelsea Kelly-Reif" },
]
readme = "README.md"
dependencies = []

[project.scripts]
chalkline = "chalkline.cli:main"

[dependency-groups]
dev = [
  "ruff>=0.16.2",
  "mypy>=1.18",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "pytest-xdist>=3.8.0",
  "pip-audit>=2.10.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/chalkline"]

[tool.hatch.build.targets.wheel.force-include]
"src/chalkline/ctdl/ctdl-context.json" = "chalkline/ctdl/ctdl-context.json"
"src/chalkline/ctdl/ctdl-schema.json" = "chalkline/ctdl/ctdl-schema.json"

# --- CODE-QUALITY-STANDARD §2 single-source ruff/mypy/pytest config ---
# Portfolio default: repos change values, not keys. Do not fork this block;
# edit STANDARDS/CODE-QUALITY-STANDARD.md upstream if the floor itself moves.

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "S", "C90", "RUF"]
ignore = ["E501"]            # line length owned by the formatter
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]        # assert is expected in tests
[tool.ruff.lint.mccabe]
max-complexity = 10
[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
warn_return_any = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
pythonpath = ["src"]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
markers = [
  "slow: > 2s",
  "integration: requires an external service",
  "smoke: critical path",
]

[tool.coverage.run]
branch = true
source = ["src"]
[tool.coverage.report]
fail_under = 90   # libraries and data projects: >=90% — CODE-QUALITY-STANDARD §2
show_missing = true
